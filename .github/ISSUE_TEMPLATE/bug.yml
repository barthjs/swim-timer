name: Bug report
description: File a bug report
title: "[Bug] "
labels: [ bug ]
assignees: [ ]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Before you submit
      description: Please confirm the following
      options:
        - label: I searched existing issues and discussions and didn’t find a match
          required: true

  - type: input
    id: app_version
    attributes:
      label: Swim-Timer version
      placeholder: e.g., v1.2.3
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Platform (OS and CPU architecture)
      description: On which Platform does the issue occur?
      options:
        - Linux, AMD64 (x86_64)
        - Linux, ARM64
        - Linux, ARMv7
        - Linux, ARMv6
        - Linux, 386
        - Linux, RISC-V 64
        - Windows, AMD64 (x86_64)
        - Windows, ARM64
        - Windows, 386
        - Container image
    validations:
      required: true

  - type: dropdown
    id: browsers
    attributes:
      label: What browsers are you seeing the problem on?
      multiple: true
      options:
        - Brave
        - Chrome
        - Chromium
        - Firefox
        - Microsoft Edge
        - Safari

  - type: input
    id: browser_version
    attributes:
      label: Browser version
      placeholder: e.g., Chrome 123

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact steps to reproduce from a fresh environment
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened? Include any error messages.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem
